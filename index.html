<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAHM TV - Streaming Profesional</title>
    <!-- Tailwind CSS para un diseño moderno -->
    <script src="https://tailwindcss.com"></script>
    <!-- Video.js para reproducción robusta de streaming HLS/M3U8 -->
    <link href="https://zencdn.net" rel="stylesheet" />
    <script src="https://zencdn.net"></script>
</head>
<body class="bg-zinc-950 text-white font-sans selection:bg-red-600">

    <!-- Navegación -->
    <nav class="bg-zinc-900 border-b border-zinc-800 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-8">
            <h1 class="text-2xl font-black tracking-wider text-red-600">LAHM <span class="text-white">TV</span></h1>
            <div class="hidden md:flex gap-6 text-sm font-medium text-zinc-400">
                <a href="#" class="hover:text-white transition">Inicio</a>
                <a href="#" class="hover:text-white transition">Canales Públicos</a>
                <a href="#" class="hover:text-white transition">Documentales</a>
                <a href="#" class="hover:text-white transition">Deportes</a>
            </div>
        </div>
        <div class="text-xs bg-zinc-800 px-3 py-1.5 rounded-full border border-zinc-700 text-zinc-400">
            Multiplataforma Activa
        </div>
    </nav>

    <!-- Contenedor Principal -->
    <main class="max-w-7xl mx-auto p-4 md:p-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Reproductor de Video -->
        <div class="lg:col-span-2 space-y-4">
            <div class="rounded-xl overflow-hidden bg-black aspect-video shadow-2xl border border-zinc-800">
                <video id="lahm-player" class="video-js vjs-default-skin vjs-big-play-centered w-full h-full" controls preload="auto" data-setup='{}'>
                    <source src="https://mux.dev" type="application/x-mpegURL">
                    <p class="vjs-no-js">Para ver este video, por favor habilita JavaScript o usa un navegador compatible.</p>
                </video>
            </div>
            <div>
                <span class="text-xs font-bold uppercase tracking-widest text-red-500" id="current-category">Documentales</span>
                <h2 class="text-xl md:text-2xl font-bold mt-1" id="current-title">Sintel - Cortometraje Abierto (Demo HLS)</h2>
                <p class="text-sm text-zinc-400 mt-2">Estás reproduciendo una señal pública optimizada para LAHM TV. Compatible con Smart TVs, móviles y ordenadores.</p>
            </div>
        </div>

        <!-- Lista de Canales y Contenido -->
        <div class="space-y-6">
            <h3 class="text-lg font-bold text-zinc-300 border-b border-zinc-800 pb-2">Guía de Canales Abiertos</h3>
            
            <div class="space-y-3 overflow-y-auto max-h-[450px] pr-2" id="playlist">
                <!-- Canal 1 -->
                <button onclick="changeStream('https://mux.dev', 'Sintel (Demo HLS)', 'Documentales')" 
                        class="w-full text-left bg-zinc-900 hover:bg-zinc-800 p-3 rounded-lg border border-zinc-800 hover:border-zinc-700 transition flex gap-4 items-center group">
                    <div class="w-12 h-12 bg-red-950 text-red-500 rounded flex items-center justify-center font-bold group-hover:bg-red-600 group-hover:text-white transition">DOC</div>
                    <div>
                        <h4 class="font-semibold text-sm">Sintel - Animación</h4>
                        <p class="text-xs text-zinc-500">Transmisión de prueba HLS</p>
                    </div>
                </button>

                <!-- Canal 2 -->
                <button onclick="changeStream('https://akamaized.net', 'Canal Deportivo (MPEG-DASH)', 'Deportes')" 
                        class="w-full text-left bg-zinc-900 hover:bg-zinc-800 p-3 rounded-lg border border-zinc-800 hover:border-zinc-700 transition flex gap-4 items-center group">
                    <div class="w-12 h-12 bg-emerald-950 text-emerald-500 rounded flex items-center justify-center font-bold group-hover:bg-emerald-600 group-hover:text-white transition">DEP</div>
                    <div>
                        <h4 class="font-semibold text-sm">Deportes del Mundo</h4>
                        <p class="text-xs text-zinc-500">Señal internacional abierta</p>
                    </div>
                </button>

                <!-- Canal 3 (NASA TV - Ejemplo Público Real) -->
                <button onclick="changeStream('https://akamaized.net', 'NASA TV Pública', 'Ciencia / Canales del Mundo')" 
                        class="w-full text-left bg-zinc-900 hover:bg-zinc-800 p-3 rounded-lg border border-zinc-800 hover:border-zinc-700 transition flex gap-4 items-center group">
                    <div class="w-12 h-12 bg-blue-950 text-blue-500 rounded flex items-center justify-center font-bold group-hover:bg-blue-600 group-hover:text-white transition">WLD</div>
                    <div>
                        <h4 class="font-semibold text-sm">NASA TV Oficial</h4>
                        <p class="text-xs text-zinc-500">Canal público de EE.UU.</p>
                    </div>
                </button>
            </div>
        </div>

    </main>

    <!-- Lógica de control -->
    <script>
        const player = videojs('lahm-player');

        function changeStream(url, title, category) {
            document.getElementById('current-title').innerText = title;
            document.getElementById('current-category').innerText = category;
            
            player.src({
                src: url,
                type: url.includes('.mpd') ? 'application/dash+xml' : 'application/x-mpegURL'
            });
            player.play();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LAHM TV Global</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

</head>

<body>

<header class="topbar">

<div class="brand">
📺 LAHM TV
</div>

<div class="search-container">
<input
id="search"
type="text"
placeholder="Buscar canal o país..."
>
</div>

</header>

<section class="hero">

<div class="hero-content">

<h1>Televisión Mundial</h1>

<p>
Canales públicos, documentales y entretenimiento gratuito.
</p>

<div class="stats">
<span id="channelCount">0 canales</span>
</div>

</div>

</section>

<section class="filters">

<button class="filter active" data-filter="all">
🌍 Todos
</button>

<button class="filter" data-filter="americas">
🌎 Américas
</button>

<button class="filter" data-filter="europe">
🌍 Europa
</button>

<button class="filter" data-filter="asia">
🌏 Asia
</button>

</section>

<section class="player-section">

<video
id="videoPlayer"
controls
playsinline>
</video>

</section>

<section class="content">

<h2>📡 Canales Disponibles</h2>

<div id="channelsGrid"></div>

</section>

<script src="app.js"></script>

</body>

</html>

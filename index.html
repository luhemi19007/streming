<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LAHM TV - Entretenimiento Global</title>

  <style>
    :root {
      --bg-color: #0f172a;
      --surface-color: #1e293b;
      --accent-color: #38bdf8;
      --text-color: #f8fafc;
      --text-secondary: #94a3b8;
      --danger-color: #ef4444;
      --success-color: #22c55e;
      --border-color: #334155;
      --shadow: 0 10px 20px -10px rgba(56, 189, 248, 0.3);
      --radius: 0.5rem;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--surface-color);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo-area { display: flex; align-items: center; gap: 0.75rem; }

    .logo-icon { font-size: 1.5rem; color: var(--accent-color); }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    nav { display: flex; gap: 1rem; }

    .nav-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      transition: all 0.2s ease;
    }

    .nav-btn:hover, .nav-btn.active { color: var(--text-color); background-color: #334155; }

    main {
      flex: 1;
      padding: 2rem;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .view-section { display: none; }
    .view-section.active { display: block; }

    .hero { text-align: center; margin-bottom: 2rem; }
    .hero h2 { font-size: 2rem; margin-bottom: 0.5rem; }
    .hero p { color: var(--text-secondary); }

    .filter-container {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }

    .filter-btn {
      background-color: var(--surface-color);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 0.5rem 1rem;
      border-radius: 2rem;
      cursor: pointer;
      font-size: 0.875rem;
      transition: all 0.2s;
      user-select: none;
    }

    .filter-btn:hover, .filter-btn.active {
      background-color: var(--accent-color);
      color: var(--bg-color);
      border-color: var(--accent-color);
      font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background-color: var(--surface-color);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
      min-height: 110px;
    }

    .card:hover { transform: translateY(-4px); box-shadow: var(--shadow); }

    .card:focus { outline: 2px solid rgba(56, 189, 248, 0.6); outline-offset: 2px; }

    .card-body {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      flex: 1;
    }

    .card-title { font-size: 1.1rem; font-weight: 600; line-height: 1.2; }
    .card-subtitle { font-size: 0.85rem; color: var(--text-secondary); }

    .player-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background-color: #000;
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 1.5rem;
      display: none;
    }

    .player-container.active { display: block; }

    video {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
      background: #000;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 1rem;
      background-color: rgba(34, 197, 94, 0.1);
      color: var(--success-color);
      width: fit-content;
    }

    .status-badge.offline {
      background-color: rgba(239, 68, 68, 0.1);
      color: var(--danger-color);
    }

    .status-dot { width: 6px; height: 6px; border-radius: 50%; background-color: currentColor; }

    .back-btn-container { margin-bottom: 1.5rem; }

    .btn-action {
      background-color: var(--accent-color);
      color: var(--bg-color);
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.375rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      transition: opacity 0.2s;
      justify-content: center;
    }

    .btn-action:hover { opacity: 0.9; }

    .loading-state, .error-state {
      text-align: center;
      padding: 3rem;
      color: var(--text-secondary);
      grid-column: 1 / -1;
    }

    .top-meta {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: center;
      margin: 0 auto 1rem auto;
      max-width: 900px;
      flex-wrap: wrap;
    }

    .search {
      flex: 1;
      min-width: 240px;
      display: flex;
      gap: 0.5rem;
      align-items: center;
      justify-content: center;
    }

    .search input {
      width: 100%;
      max-width: 520px;
      border-radius: 0.75rem;
      border: 1px solid var(--border-color);
      background: #0b1223;
      color: var(--text-color);
      padding: 0.7rem 0.9rem;
      outline: none;
    }

    .search input:focus {
      border-color: rgba(56, 189, 248, 0.7);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .pill {
      padding: 0.35rem 0.65rem;
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      border-radius: 999px;
      font-size: 0.85rem;
      white-space: nowrap;
    }
  </style>
</head>

<body>
<header>
  <div class="logo-area">
    <span class="logo-icon">📺</span>
    <h1>LAHM TV</h1>
  </div>
  <nav>
    <button class="nav-btn active" data-target="live-view">TV en vivo</button>
    <button class="nav-btn" data-target="catalog-view">Catálogo</button>
  </nav>
</header>

<main>
  <!-- VISTA: TV EN VIVO -->
  <section id="live-view" class="view-section active">
    <div class="hero">
      <h2>TV en Vivo Global</h2>
      <p>Selecciona un canal para reproducir su señal pública disponible de forma estable.</p>
    </div>

    <div class="top-meta">
      <div class="search">
        <input id="channel-search" type="text" placeholder="Buscar por canal o país (ej: México, France 24, NHK)..." autocomplete="off" />
      </div>
      <div class="pill" id="channels-count">Cargando...</div>
    </div>

    <div id="player-wrapper" class="player-container" aria-live="polite">
      <video id="video-player" controls playsinline></video>
    </div>

    <div class="filter-container" id="continent-filters" role="tablist" aria-label="Filtrar por continente">
      <button class="filter-btn active" data-continent="all" type="button">Todos</button>
      <button class="filter-btn" data-continent="americas" type="button">Américas</button>
      <button class="filter-btn" data-continent="europe" type="button">Europa</button>
      <button class="filter-btn" data-continent="asia" type="button">Asia</button>
      <button class="filter-btn" data-continent="africa" type="button">África</button>
      <button class="filter-btn" data-continent="oceania" type="button">Oceanía</button>
    </div>

    <div id="channels-grid" class="grid">
      <div class="loading-state">Cargando canales públicos de todo el mundo...</div>
    </div>
  </section>

  <!-- VISTA: CATÁLOGO -->
  <section id="catalog-view" class="view-section">
    <div class="back-btn-container">
      <button class="btn-action" id="back-to-home" type="button">← Volver a LAHM TV</button>
    </div>

    <div class="hero">
      <h2>Películas y Series Gratuitas</h2>
      <p>Plataformas y accesos que ofrecen contenido legal y gratuito sin costo oculto.</p>
    </div>

    <div class="grid" id="catalog-grid"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js"></script>
<script>
  /**
   * IMPORTANTE:
   * No existe un “listado universal” garantizado de HLS para TODOS los canales del mundo.
   * Aquí dejamos un loader listo para que pegues/uses una base JSON completa.
   * Por defecto incluyo tus ejemplos para que funcione ya.
   */

  const DEFAULT_CHANNELS_DB = [
    // Américas
    { name: "NASA TV HD", continent: "americas", country: "Estados Unidos", url: "https://ntv1.nasa.gov/hls/live/511640/NASA-NTV1-HLS/master.m3u8", status: "online" },
    { name: "TV Brasil", continent: "americas", country: "Brasil", url: "https://live-edge01.tele-global.net/hls/live/2092100/tvbrasil/index.m3u8", status: "online" },
    { name: "Cámara de Diputados", continent: "americas", country: "México", url: "https://stream.camaradediputados.gob.mx/hls/livestream.m3u8", status: "online" },
    { name: "Canal Congreso", continent: "americas", country: "Colombia", url: "https://59d33b432a106.streamlock.net/live/congreso1.smil/playlist.m3u8", status: "online" },
    { name: "TV Perú", continent: "americas", country: "Perú", url: "https://cdnmx.frecuenciastreaming.com/tvperu/index.m3u8", status: "online" },
    { name: "Televisión Nacional (TVN)", continent: "americas", country: "Chile", url: "https://tvn-live.hls.internapcdn.net/tvn/live/playlist.m3u8", status: "online" },
    { name: "Canal 10", continent: "americas", country: "Uruguay", url: "https://edge-c10.stweb.tv/live/smil:canal10.smil/playlist.m3u8", status: "online" },
    { name: "TV Pública", continent: "americas", country: "Argentina", url: "https://live-s3.tele-global.net/hls/live/2092101/tvpublica/index.m3u8", status: "online" },
    { name: "Televisión de Asamblea", continent: "americas", country: "Costa Rica", url: "https://59c122822858d.streamlock.net/asamblea/asamblea.smil/playlist.m3u8", status: "online" },
    { name: "Canal 12", continent: "americas", country: "El Salvador", url: "https://live.elsalvador.com/hls/canal12.m3u8", status: "online" },
    { name: "TVN Canal 2", continent: "americas", country: "Panamá", url: "https://stream-tvn.medcom.gob.pa/hls/live/live.m3u8", status: "online" },
    { name: "Televicentro Guatevision", continent: "americas", country: "Guatemala", url: "https://gt-s1.live.gt/guatevision/live/playlist.m3u8", status: "online" },
    { name: "Televen", continent: "americas", country: "Venezuela", url: "https://streaming.televen.com/hls/televen.m3u8", status: "online" },
    { name: "Ecuador TV", continent: "americas", country: "Ecuador", url: "https://streaming.rtve.gob.ec/hls/ecuadortv.m3u8", status: "online" },
    { name: "Bolivia TV", continent: "americas", country: "Bolivia", url: "https://stream.boltv.bo/hls/live.m3u8", status: "online" },

    // Europa
    { name: "France 24 Español", continent: "europe", country: "Francia", url: "https://static.france24.com/live/F24_ES_HI_HLS/live_web.m3u8", status: "online" },
    { name: "DW Español", continent: "europe", country: "Alemania", url: "https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/index.m3u8", status: "online" },
    { name: "RTVE Play / Canal 24h", continent: "europe", country: "España", url: "https://rtvelive.akamaized.net/hls/live/2017409/24h_v1/master.m3u8", status: "online" },
    { name: "Rai News 24", continent: "europe", country: "Italia", url: "https://rainews24live.akamaized.net/hls/live/614251/rainews24/rainews24_1/playlist.m3u8", status: "online" },
    { name: "Swiss Info", continent: "europe", country: "Suiza", url: "https://srgssr-sfi-live.akamaized.net/hls/live/2030999/sfi_en/master.m3u8", status: "online" },

    // Asia y Medio Oriente
    { name: "NHK World Japan", continent: "asia", country: "Japón", url: "https://nhkworld.live-s.cdn.bitgravity.com/cdn-live/live/_definst_/content/nhkworld_1_hls/index.m3u8", status: "online" },
    { name: "Al Jazeera English", continent: "asia", country: "Qatar", url: "https://live-hls-web-aje.getaj.net/AJE/index.m3u8", status: "online" },
    { name: "TRT World", continent: "asia", country: "Turquía", url: "https://trtworld.rakuten.tv/v1/master/74d75d311fa673e1e5564cdcd8b1f5c6a1e36785/trt-world/master.m3u8", status: "online" },
    { name: "Arirang TV", continent: "asia", country: "Corea del Sur", url: "https://amlivehls.akamaized.net/hls/live/2013063/arirang1/index.m3u8", status: "online" },

    // África
    { name: "SABC News", continent: "africa", country: "Sudáfrica", url: "https://sabc-sabcnews-1-ng.rakuten.tv/v1/master/74d75d311fa673e1e5564cdcd8b1f5c6a1e36785/sabc-sabcnews-1-ng/master.m3u8", status: "online" },

    // Oceanía
    { name: "ABC News Australia", continent: "oceania", country: "Australia", url: "https://abchls.akamaized.net/hls/live/2034426/abckids/master.m3u8", status: "online" }
  ];

  const CATALOG_DB = [
    { name: "Pluto TV", desc: "Televisión gratuita con cientos de canales y películas bajo demanda.", url: "https://pluto.tv/" },
    { name: "Tubi", desc: "Miles de películas y series gratuitas con anuncios legales.", url: "https://tubitv.com/" },
    { name: "Rakuten TV (Gratis)", desc: "Sección gratuita de películas y documentales europeos.", url: "https://rakuten.tv/" },
    { name: "Rlaxx TV", desc: "Servicio de streaming FAST gratuito multiplataforma.", url: "https://www.rlaxx.com/" },
    { name: "Plex", desc: "Contenido gratuito con anuncios y televisión en vivo.", url: "https://www.plex.tv/" }
  ];

  let CHANNELS_DB = DEFAULT_CHANNELS_DB; // aquí conectas tu JSON real si tienes uno

  let currentHls = null;
  let currentVideoRequestId = 0;

  const el = (id) => document.getElementById(id);

  document.addEventListener("DOMContentLoaded", () => {
    initNavigation();
    loadChannels("all");
    loadCatalog();
    updateCounts("all", "");
    initSearch();
  });

  function initNavigation() {
    const navButtons = document.querySelectorAll(".nav-btn");
    const sections = document.querySelectorAll(".view-section");
    const backBtn = el("back-to-home");

    navButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        const targetId = btn.getAttribute("data-target");

        navButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");

        sections.forEach(sec => {
          sec.classList.remove("active");
          if (sec.id === targetId) sec.classList.add("active");
        });

        if (targetId !== "live-view") stopVideoPlayer();
      });
    });

    if (backBtn) {
      backBtn.addEventListener("click", () => {
        document.querySelector('.nav-btn[data-target="live-view"]').click();
      });
    }

    const filterBtns = document.querySelectorAll(".filter-btn");
    filterBtns.forEach(fBtn => {
      fBtn.addEventListener("click", () => {
        filterBtns.forEach(b => b.classList.remove("active"));
        fBtn.classList.add("active");
        const continent = fBtn.getAttribute("data-continent");
        const query = el("channel-search").value.trim().toLowerCase();
        loadChannels(continent, query);
        updateCounts(continent, query);
      });
    });
  }

  function initSearch() {
    const input = el("channel-search");
    if (!input) return;

    let t = null;

    input.addEventListener("input", () => {
      clearTimeout(t);
      t = setTimeout(() => {
        const activeBtn = document.querySelector('.filter-btn.active');
        const continent = activeBtn ? activeBtn.getAttribute("data-continent") : "all";
        const query = input.value.trim().toLowerCase();
        loadChannels(continent, query);
        updateCounts(continent, query);
      }, 180);
    });
  }

  function normalizeChannel(c) {
    if (!c) return null;
    const name = String(c.name || "").trim();
    const country = String(c.country || "").trim();
    const url = String(c.url || "").trim();
    const continent = String(c.continent || "").trim();

    if (!name || !country || !url || !continent) return null;
    return { name, country, url, continent, status: (c.status === "online" ? "online" : "offline") };
  }

  function loadChannels(continentFilter, query = "") {
    const grid = el("channels-grid");
    grid.innerHTML = "";

    const normalized = CHANNELS_DB.map(normalizeChannel).filter(Boolean);

    let filtered = normalized;

    if (continentFilter !== "all") filtered = filtered.filter(c => c.continent === continentFilter);

    if (query) {
      filtered = filtered.filter(c =>
        c.name.toLowerCase().includes(query) ||
        c.country.toLowerCase().includes(query)
      );
    }

    if (!filtered.length) {
      grid.innerHTML = `<div class="error-state">No hay canales disponibles para esta búsqueda/región por el momento.</div>`;
      return;
    }

    const frag = document.createDocumentFragment();

    filtered.forEach(channel => {
      const card = document.createElement("div");
      card.className = "card";
      card.setAttribute("role", "button");
      card.setAttribute("tabindex", "0");
      card.setAttribute("aria-label", `Reproducir ${channel.name} de ${channel.country}`);

      card.innerHTML = `
        <div class="card-body">
          <span class="status-badge ${channel.status === "online" ? "" : "offline"}">
            <span class="status-dot"></span> ${channel.status === "online" ? "Disponible" : "Sin señal"}
          </span>
          <div class="card-title">${escapeHtml(channel.name)}</div>
          <div class="card-subtitle">${escapeHtml(channel.country)}</div>
        </div>
      `;

      const handler = () => playChannel(channel);
      card.addEventListener("click", handler);
      card.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); handler(); }
      });

      frag.appendChild(card);
    });

    grid.appendChild(frag);
  }

  function playChannel(channel) {
    const video = el("video-player");
    const wrapper = el("player-wrapper");
    const requestId = ++currentVideoRequestId;

    wrapper.classList.add("active");

    if (currentHls) {
      currentHls.destroy();
      currentHls = null;
    }

    video.pause();
    video.removeAttribute("src");
    video.load();

    if (Hls.isSupported()) {
      const hls = new Hls({
        autoStart: false,
        startLevel: -1,
        capLevelToPlayerSize: true,
        xhrSetup: function (xhr) { xhr.withCredentials = false; },
        // Reintentos razonables en caso de fallo (sin prometer “siempre funciona”)
        backoffRetryDelay: 1000,
        maxRetryDelay: 8000
      });

      currentHls = hls;

      hls.attachMedia(video);

      hls.on(Hls.Events.MEDIA_ATTACHED, () => {
        if (requestId !== currentVideoRequestId) return; // si el usuario cambió rápido
        hls.loadSource(channel.url);
        hls.startLoad();
      });

      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        if (requestId !== currentVideoRequestId) return;
        video.play().catch(() => {
          // Autoplay bloqueado: el control del usuario sigue funcionando
        });
      });

      hls.on(Hls.Events.ERROR, (event, data) => {
        if (requestId !== currentVideoRequestId) return;
        if (!data || !data.fatal) return;

        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
          try { hls.startLoad(); } catch (_) {}
          return;
        }

        if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
          try { hls.recoverMediaError(); } catch (_) {}
          return;
        }

        stopVideoPlayer();
        alert(`No se pudo reproducir ${channel.name}. La señal puede estar temporalmente inactiva o no disponible para tu navegador.`);
      });

    } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
      // iOS Safari / algunos navegadores
      video.src = channel.url;
      const onMeta = () => {
        if (requestId !== currentVideoRequestId) return;
        video.play().catch(() => {});
      };
      video.addEventListener("loadedmetadata", onMeta, { once: true });
    } else {
      alert("Tu navegador no soporta la reproducción de streams HLS.");
    }
  }

  function stopVideoPlayer() {
    const video = el("video-player");
    const wrapper = el("player-wrapper");

    video.pause();
    video.removeAttribute("src");
    video.load();

    if (currentHls) {
      try { currentHls.destroy(); } catch (_) {}
      currentHls = null;
    }

    wrapper.classList.remove("active");
  }

  function loadCatalog() {
    const catalogGrid = el("catalog-grid");
    catalogGrid.innerHTML = "";

    const frag = document.createDocumentFragment();

    CATALOG_DB.forEach(item => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="card-body">
          <div class="card-title">${escapeHtml(item.name)}</div>
          <div class="card-subtitle" style="margin-bottom: 1rem; color: var(--text-secondary);">${escapeHtml(item.desc)}</div>
          <a href="${escapeAttr(item.url)}" target="_blank" rel="noopener noreferrer" class="btn-action" style="text-align:center; justify-content:center;">
            Visitar Sitio Legal ↗
          </a>
        </div>
      `;
      frag.appendChild(card);
    });

    catalogGrid.appendChild(frag);
  }

  function updateCounts(continentFilter, query) {
    const container = el("channels-count");
    if (!container) return;

    const normalized = CHANNELS_DB.map(normalizeChannel).filter(Boolean);

    let filtered = normalized;
    if (continentFilter !== "all") filtered = filtered.filter(c => c.continent === continentFilter);

    if (query) {
      filtered = filtered.filter(c =>
        c.name.toLowerCase().includes(query) ||
        c.country.toLowerCase().includes(query)
      );
    }

    container.textContent = `${filtered.length} canal(es)`;
  }

  function escapeHtml(str) {
    return String(str)
      .replaceAll("&", "&")
      .replaceAll("<", "<")
      .replaceAll(">", ">")
      .replaceAll('"', """)
      .replaceAll("'", "'");
  }

  function escapeAttr(str) {
    // Para URLs en atributos
    const s = String(str);
    return s.replaceAll('"', "%22").replaceAll("'", "%27");
  }

</script>

<style>
  :root{
    --bg: #0a0d10;
    --bg-raised: #12171b;
    --bg-card: #161c21;
    --line: #232b31;
    --text: #e9edef;
    --text-dim: #8b979d;
    --text-faint: #5b666c;
    --signal: #5eead4;
    --signal-dim: #2c4b47;
    --tuner: #ffb454;
    --danger: #ff6b6b;
    --font-display: 'Archivo Expanded', sans-serif;
    --font-body: 'IBM Plex Sans', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
  }
  a{ color: inherit; }
  ::selection{ background: var(--signal); color: #06110f; }

  /* ---------- Top bar ---------- */
  .topbar{
    position: sticky; top:0; z-index: 30;
    display:flex; align-items:center; gap:20px;
    padding: 14px 22px;
    background: rgba(10,13,16,0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 20px;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }
  .brand .dot{
    width:10px; height:10px; border-radius:50%;
    background: var(--signal);
    box-shadow: 0 0 0 3px var(--signal-dim), 0 0 10px var(--signal);
    animation: pulse 2.4s ease-in-out infinite;
    flex-shrink:0;
  }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.4; } }
  .clock{
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .search-wrap{
    flex: 1;
    max-width: 420px;
    position: relative;
  }
  .search-wrap input{
    width:100%;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 10px 14px 10px 36px;
    border-radius: 8px;
    font-size: 14px;
    font-family: var(--font-body);
    outline: none;
    transition: border-color .15s ease;
  }
  .search-wrap input:focus{ border-color: var(--signal); }
  .search-wrap svg{
    position:absolute; left:11px; top:50%; transform: translateY(-50%);
    width:15px; height:15px; stroke: var(--text-faint);
  }
  .fav-toggle{
    display:flex; align-items:center; gap:6px;
    background: none; border: 1px solid var(--line);
    color: var(--text-dim);
    padding: 9px 14px;
    border-radius: 8px;
    font-family: var(--font-body);
    font-size: 13px;
    cursor:pointer;
    white-space:nowrap;
    transition: border-color .15s ease, color .15s ease;
  }
  .fav-toggle.active{ border-color: var(--tuner); color: var(--tuner); }
  .fav-toggle:hover, .fav-toggle:focus{ border-color: var(--text); color: var(--text); outline: none; }

  /* ---------- Layout ---------- */
  .layout{
    display:grid;
    grid-template-columns: 240px 1fr;
    gap: 0;
    max-width: 1400px;
    margin: 0 auto;
  }
  @media (max-width: 860px){
    .layout{ grid-template-columns: 1fr; }
    .rail{ position: static; height:auto; border-right:none; border-bottom:1px solid var(--line); }
  }

  /* ---------- Side rail ---------- */
  .rail{
    position: sticky; top: 61px;
    height: calc(100vh - 61px);
    overflow-y: auto;
    border-right: 1px solid var(--line);
    padding: 18px 10px 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .rail-label{
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-faint);
    padding: 10px 10px 6px;
    letter-spacing: 0.06em;
  }
  .rail-item{
    display:flex; align-items:center; gap:10px;
    width:100%;
    background: none; border:none;
    color: var(--text-dim);
    padding: 8px 10px;
    border-radius: 7px;
    font-family: var(--font-body);
    font-size: 13.5px;
    text-align:left;
    cursor:pointer;
    margin-bottom: 1px;
  }
  .rail-item .flag{ font-size:15px; width: 20px; text-align: center; }
  .rail-item:hover, .rail-item:focus{ background: var(--bg-raised); color: var(--text); outline: none; }
  .rail-item.active{ background: var(--bg-card); color: var(--signal); }
  .rail-divider{ height:1px; background:var(--line); margin: 12px 8px; }

  /* Firma Legal de Copyright */
  .app-credits {
    margin-top: 25px;
    padding: 14px 10px 5px;
    border-top: 1px solid var(--line);
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-faint);
    line-height: 1.6;
  }
  .app-credits .author-name {
    color: var(--text-dim);
    font-weight: 600;
    font-size: 11px;
    margin-top: 2px;
    letter-spacing: 0.2px;
  }

  /* ---------- Main ---------- */
  .main{ padding: 20px 22px 60px; min-height: 70vh; }
  .section-head{
    display:flex; align-items:baseline; justify-content:space-between;
    gap: 12px; margin-bottom: 16px; flex-wrap: wrap;
  }
  .section-head h1{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 22px;
    margin: 0;
  }
  .count-tag{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-faint);
  }

  .empty{
    padding: 60px 10px; text-align:center; color: var(--text-dim); width: 100%; grid-column: 1 / -1;
  }
  .empty .big{ font-family: var(--font-display); font-size: 18px; color: var(--text); margin-bottom:6px; }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
    gap: 12px;
  }
  
  .tile{
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 12px 12px;
    cursor:pointer;
    position: relative;
    transition: border-color .15s ease, transform .1s ease;
    display:flex; flex-direction:column; gap:10px;
    text-align: left;
  }
  .tile:hover, .tile:focus{ border-color: var(--signal); background: var(--bg-raised); outline: none; }
  .tile:active{ transform: scale(0.98); }
  .tile .logo-box{
    width:100%; height:56px;
    display:flex; align-items:center; justify-content:center;
    background: #0d1114;
    border-radius: 6px;
    overflow:hidden;
  }
  .tile .logo-box .fallback{
    font-family: var(--font-mono); font-size:11px; color: var(--text-faint); padding: 0 6px; text-align:center;
    text-transform: uppercase;
  }
  .tile .name{
    font-size: 13px; font-weight: 500; line-height:1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow:hidden;
  }
  .tile .meta{
    font-family: var(--font-mono); font-size:10.5px; color: var(--text-faint);
    display: flex; justify-content: space-between; align-items: center;
  }
  .star-btn{
    position:absolute; top:8px; right:8px;
    width:26px; height:26px;
    border-radius:50%;
    background: rgba(10,13,16,0.7);
    border: none;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    color: var(--text-faint);
    z-index: 5;
  }
  .star-btn.on{ color: var(--tuner); }
  .star-btn svg{ width:14px; height:14px; pointer-events: none; }

  /* ---------- Player overlay ---------- */
  .player-overlay{
    position: fixed; inset:0; z-index: 100;
    background: rgba(5,7,8,0.88);
    backdrop-filter: blur(4px);
    display:flex; align-items:center; justify-content:center;
    padding: 24px;
    opacity:0; pointer-events:none;
    transition: opacity .15s ease;
  }
  .player-overlay.open{ opacity:1; pointer-events:all; }
  .player-panel{
    width:100%; max-width: 920px;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow:hidden;
    position: relative;
  }
  .player-head{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
  }
  .player-title-box {
    display:flex; align-items:center; gap:12px;
    max-width: 65%;
  }
  .player-head .player-title{ font-family: var(--font-display); font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  
  .close-btn {
    background: none; border: none; color: var(--text-dim); cursor: pointer; padding: 4px;
    display: flex; align-items: center; justify-content: center; transition: color 0.15s;
  }
  .close-btn:hover, .close-btn:focus { color: var(--text); outline: none; }

  .video-container {
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    position: relative;
  }
  video { width: 100%; height: 100%; display: block; }

  .stream-status {
    display: flex; align-items: center; gap: 6px;
